name: Tox

on:
  pull_request:
    branches:
      - master
    paths:
      - 'faster_eth_abi/**.py'
      - 'tests/**.py'
      - '.github/workflows/tox.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'tox.ini'
      - "!eth-abi-stubs/**"
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.jobtype }}, 3.${{ matrix.pyminor }}, ${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.installmode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        jobtype: [core, wheel]
        os: [ubuntu-latest, macos-latest, windows-latest]
        architecture: [x64, x86]
        pyminor: ["10", "11", "12", "13", "13t", "14", "14t"]
        installmode: [source, sdist]
        exclude:
          # Exclude x86 (32-bit) builds for macos, which doesn't support 32-bit at all
          - os: macos-latest
            architecture: x86
          # If these tests work for x64 builds, x86 builds will work fine
          - installmode: sdist
            architecture: x86
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ github.event_name == 'schedule' && 4 || 1000 }}
    env:
      IS_UBUNTU_32BIT: ${{ matrix.os == 'ubuntu-latest' && matrix.architecture == 'x86' }}
      TOXENV: py3${{ matrix.pyminor }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}

    steps:
      - name: Checkout code and tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Use i386/python Docker for all 32-bit Ubuntu jobs (TODO cache some of this)
      - name: Run job in 32-bit Ubuntu Docker container
        if: ${{ env.IS_UBUNTU_32BIT == 'true' }}
        uses: addnab/docker-run-action@v3
        with:
          image: i386/python:3.${{ matrix.pyminor }}
          shell: bash
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            python -m pip install --upgrade pip
            python -m pip install tox
            if [[ "${{ matrix.jobtype }}" == "wheel" ]]; then
              python -m pip install "build[virtualenv]"
              python -m build --wheel
              export WHEEL_PATH="$(find dist -name '*.whl' -print -quit)"
              if [[ -z "$WHEEL_PATH" ]]; then
                echo "No wheel artifact found in dist"
                exit 1
              fi
              rm -r faster_eth_abi
            fi
            python -m tox -e ${{ env.TOXENV }} ${{ env.TOX_RECREATE_FLAG }}
        # There are no prebuilt 32-bit freethreaded Python containers at the time of this commit, but
        # we will keep these runners so they will activate on their own whenever such containers exist
        continue-on-error: ${{ matrix.pyminor == '13t' || matrix.pyminor == '14t' }}

      # No architecture specified for MacOS
      - name: Set up Python (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
            tox.ini

      # All other builds (64-bit Linux, 32-bit and 64-bit Windows)
      - name: Set up Python
        if: ${{ matrix.os != 'macos-latest' && env.IS_UBUNTU_32BIT != 'true' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
            tox.ini

      - name: Build wheel with mypycify
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        id: mypycify
        uses: BobTheBuidler/mypycify@v0.5.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          python-architecture: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' && matrix.architecture || '' }}
          hash-key: |
            faster_eth_abi/**/*.py
            pyproject.toml
            setup.py
            .github/mypycify-hash/${{ matrix.architecture }}.txt
          build-from: ${{ matrix.installmode }}
          pip-cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini

      - name: Restore Windows x86 Python
        if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          architecture: ${{ matrix.architecture }}

      - name: Validate Windows x86 Python
        if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
        run: python -c "import struct; bits = struct.calcsize('P') * 8; assert bits == 32, bits"

      - name: Download built wheel artifact
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.mypycify.outputs.artifact-name }}
          path: dist

      - name: Validate Windows x86 wheel tag
        if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel in dist, found ${#wheels[@]}"
            printf '%s\n' "${wheels[@]}"
            exit 1
          fi
          wheel="${wheels[0]}"
          if [[ "$wheel" != *-win32.whl ]]; then
            echo "Expected Windows x86 wheel tagged win32, got: $wheel"
            exit 1
          fi

      - name: Upgrade pip and install tox
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Cache .mypy_cache
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-cache-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}

      - name: Cache tox environment and hypothesis examples
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            .tox
            .hypothesis
          key: ${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-${{ matrix.architecture }}-${{ matrix.jobtype }}
          save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

      - name: Remove Python files so wheel will be used
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        run: rm -r faster_eth_abi

      - name: Run tox
        if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
        run: |
          WHEEL_PATH="$(find dist -name '*.whl' -print -quit)"
          if [[ -z "$WHEEL_PATH" ]]; then
            echo "No wheel artifact found in dist"
            exit 1
          fi
          if [[ "${{ matrix.jobtype }}" == "wheel" ]]; then
            WHEEL_PATH="$WHEEL_PATH" python -m tox run ${{ env.TOX_RECREATE_FLAG }}
          else
            python -m tox run ${{ env.TOX_RECREATE_FLAG }} --installpkg="$WHEEL_PATH"
          fi
        shell: bash
